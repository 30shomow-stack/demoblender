<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
	<a-scene>
		<a-sky color="#ECECEC"></a-sky>
		<a-camera position="0 1.5 0"></a-camera>
		
		<!-- Load the Blender file -->
		<a-assets>
			<a-assets-item id="myBlender"src="CASTLEPORJECT,glb"><\a-assets-item>
		</assets>
		<!-- Display file -->
		<a-entity gltf-model="#myBlender"></a-entity>
	</a-scene>
  </body>
</html>
